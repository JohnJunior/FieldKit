<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>FieldKit — offline field notes</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="app-bar">
    <h1>FieldKit</h1>
    <div class="app-bar__actions">
      <span id="net-status" class="badge" aria-live="polite">online</span>
      <button id="install-btn" class="btn btn--ghost" hidden>Install</button>
    </div>
  </header>

  <main id="entries" class="entries" aria-live="polite">
    <!-- Entries render here -->
  </main>

  <form id="entry-form" class="composer" autocomplete="off">
    <input id="entry-text" name="text" class="composer__input"
           placeholder="Add a field note…" required />
    <button class="btn btn--primary" type="submit">Add</button>
  </form>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>

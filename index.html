<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>FieldKit — offline field notes</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="app-bar">
    <h1>FieldKit</h1>
    <div class="app-bar__actions">
      <span id="net-status" class="badge" aria-live="polite">online</span>
      <button id="install-btn" class="btn btn--ghost" hidden>Install</button>
    </div>
  </header>

  <main id="entries" class="entries" aria-live="polite">
    <!-- Entries render here -->
  </main>

  <form id="entry-form" class="composer" autocomplete="off">
    <div id="attach-chip" class="chip" hidden>
      <span id="attach-label">attachment</span>
      <button type="button" id="attach-remove" aria-label="Remove attachment">&times;</button>
    </div>
    <div class="composer__row">
      <button type="button" id="add-photo" class="btn btn--icon" aria-label="Add photo" title="Add photo">📷</button>
      <button type="button" id="add-audio" class="btn btn--icon" aria-label="Record audio" title="Record audio">🎙️</button>
      <input id="entry-text" name="text" class="composer__input" placeholder="Add a field note…" />
      <button class="btn btn--primary" type="submit">Add</button>
    </div>
  </form>

  <!-- Live camera preview for photo capture (getUserMedia). -->
  <div id="camera" class="camera" hidden>
    <video id="camera-video" class="camera__video" playsinline muted></video>
    <div class="camera__controls">
      <button type="button" id="camera-cancel" class="btn btn--ghost">Cancel</button>
      <button type="button" id="camera-snap" class="btn btn--primary">Capture</button>
    </div>
  </div>

  <!-- iOS has no install prompt, so we show a manual hint there instead. -->
  <div id="ios-hint" class="ios-hint" hidden>
    <span>Install FieldKit: tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</span>
    <button id="ios-hint-close" class="ios-hint__close" aria-label="Dismiss">&times;</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
